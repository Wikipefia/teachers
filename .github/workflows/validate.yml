name: Validate Content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate all teacher configs & articles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Validate all teachers
        run: pnpm validate

  structure-check:
    name: Check repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check teacher directories
        run: |
          ERRORS=0
          TEACHER_COUNT=0

          for dir in */; do
            dir="${dir%/}"
            # Skip non-teacher directories
            case "$dir" in
              node_modules|scripts|.github|.git|dist) continue ;;
            esac

            if [ ! -f "$dir/config.json" ]; then
              continue  # Not a teacher directory
            fi

            TEACHER_COUNT=$((TEACHER_COUNT + 1))
            echo "Checking teacher: $dir"

            # Validate JSON
            if ! python3 -c "import json; json.load(open('$dir/config.json'))"; then
              echo "::error::$dir/config.json is not valid JSON"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check articles directory exists
            if [ ! -d "$dir/articles" ]; then
              echo "::error::$dir/articles/ directory is missing"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check at least one _front.mdx exists
            FRONT_COUNT=0
            for locale in en ru cz; do
              if [ -f "$dir/articles/$locale/_front.mdx" ]; then
                FRONT_COUNT=$((FRONT_COUNT + 1))
              elif [ -d "$dir/articles/$locale" ]; then
                echo "::error::$dir/articles/$locale/ exists but has no _front.mdx"
                ERRORS=$((ERRORS + 1))
              fi
            done

            if [ "$FRONT_COUNT" -eq 0 ]; then
              echo "::error::$dir: No _front.mdx in any locale"
              ERRORS=$((ERRORS + 1))
            fi

            # Check slug matches directory name
            SLUG=$(python3 -c "import json; print(json.load(open('$dir/config.json')).get('slug', ''))")
            if [ "$SLUG" != "$dir" ]; then
              echo "::error::$dir/config.json: slug '$SLUG' does not match directory name '$dir'"
              ERRORS=$((ERRORS + 1))
            fi

            echo "✓ $dir structure OK"
          done

          echo ""
          echo "Teachers found: $TEACHER_COUNT"

          if [ "$TEACHER_COUNT" -eq 0 ]; then
            echo "::error::No teacher directories found"
            exit 1
          fi

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

  frontmatter-check:
    name: Validate MDX frontmatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check all frontmatter
        run: |
          pip install pyyaml > /dev/null 2>&1
          python3 << 'PYEOF'
          import yaml, os, sys, json

          errors = []

          # Find teacher directories (those with config.json)
          for entry in sorted(os.listdir(".")):
              config_path = os.path.join(entry, "config.json")
              articles_dir = os.path.join(entry, "articles")
              if not os.path.isdir(entry) or not os.path.isfile(config_path):
                  continue

              if not os.path.isdir(articles_dir):
                  continue

              for locale in os.listdir(articles_dir):
                  locale_dir = os.path.join(articles_dir, locale)
                  if not os.path.isdir(locale_dir):
                      continue

                  for f in sorted(os.listdir(locale_dir)):
                      if not f.endswith(".mdx"):
                          continue
                      filepath = os.path.join(locale_dir, f)
                      with open(filepath) as fh:
                          content = fh.read()

                      if not content.startswith("---"):
                          errors.append(f"{filepath}: Missing frontmatter")
                          continue

                      parts = content.split("---", 2)
                      if len(parts) < 3:
                          errors.append(f"{filepath}: Unclosed frontmatter")
                          continue

                      try:
                          fm = yaml.safe_load(parts[1])
                      except yaml.YAMLError as e:
                          errors.append(f"{filepath}: Invalid YAML: {e}")
                          continue

                      if not isinstance(fm, dict):
                          errors.append(f"{filepath}: Frontmatter is not a mapping")
                          continue

                      for field in ["title", "slug", "keywords", "created"]:
                          if field not in fm:
                              errors.append(f"{filepath}: Missing required field '{field}'")

                      for field in ["title", "keywords"]:
                          if field in fm and isinstance(fm[field], dict):
                              for loc in ["ru", "en", "cz"]:
                                  if loc not in fm[field]:
                                      errors.append(f"{filepath}: '{field}' missing locale '{loc}'")

                      expected_slug = os.path.splitext(f)[0]
                      if "slug" in fm and fm["slug"] != expected_slug:
                          errors.append(f"{filepath}: slug '{fm['slug']}' != filename '{expected_slug}'")

          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              print(f"\n{len(errors)} error(s)", file=sys.stderr)
              sys.exit(1)
          else:
              print("✓ All teacher frontmatter valid")
          PYEOF
